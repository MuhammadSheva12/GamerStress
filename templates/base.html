<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}GamerStress{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
              display: ["Rajdhani", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-[#F8F7FF] text-[#1E1B4B] min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="relative bg-white border-b border-gray-200 px-4 sm:px-6 py-4 shadow-sm sticky top-0 z-50">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <a href="/" class="flex items-center gap-2 text-lg sm:text-xl font-bold text-[#6366F1]">
          GamerStress
        </a>
        <!-- Menu desktop -->
        <div class="hidden md:flex gap-8 text-sm font-medium">
          <a href="/" class="transition {% if request.path == '/' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Beranda</a>
          <a href="/predict" class="transition {% if request.path == '/predict' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Prediksi</a>
          <a href="/dataset" class="transition {% if request.path == '/dataset' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Dataset</a>
          <a href="/cek-hasil" class="transition {% if request.path == '/cek-hasil' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Cek Hasil</a>
          <a href="/about" class="transition {% if request.path == '/about' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Tentang</a>
        </div>
        <!-- Tombol hamburger (mobile) -->
        <button id="navToggle" class="md:hidden p-2 text-[#1E1B4B]" aria-label="Buka menu" aria-expanded="false">
          <svg id="iconOpen" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg id="iconClose" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Menu mobile: overlay mengambang, tidak mendorong konten -->
      <div
        id="navMenu"
        class="md:hidden absolute left-0 right-0 top-full bg-white border-b border-gray-200 shadow-md overflow-hidden max-h-0 opacity-0 transition-all duration-300 ease-in-out"
      >
        <div class="flex flex-col gap-4 px-4 sm:px-6 py-4 text-sm font-medium">
          <a href="/" class="transition {% if request.path == '/' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Beranda</a>
          <a href="/predict" class="transition {% if request.path == '/predict' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Prediksi</a>
          <a href="/dataset" class="transition {% if request.path == '/dataset' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Dataset</a>
          <a href="/cek-hasil" class="transition {% if request.path == '/cek-hasil' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Cek Hasil</a>
          <a href="/about" class="transition {% if request.path == '/about' %}text-[#6366F1]{% else %}text-[#1E1B4B] hover:text-[#6366F1]{% endif %}">Tentang</a>
        </div>
      </div>
    </nav>

    <script>
      const navToggle = document.getElementById("navToggle");
      const navMenu = document.getElementById("navMenu");
      const iconOpen = document.getElementById("iconOpen");
      const iconClose = document.getElementById("iconClose");

      navToggle.addEventListener("click", function () {
        const isOpen = navMenu.classList.contains("max-h-96");

        if (isOpen) {
          // tutup
          navMenu.classList.remove("max-h-96", "opacity-100");
          navMenu.classList.add("max-h-0", "opacity-0");
          navToggle.setAttribute("aria-expanded", "false");
        } else {
          // buka
          navMenu.classList.remove("max-h-0", "opacity-0");
          navMenu.classList.add("max-h-96", "opacity-100");
          navToggle.setAttribute("aria-expanded", "true");
        }

        iconOpen.classList.toggle("hidden");
        iconClose.classList.toggle("hidden");
      });

      // tutup menu otomatis saat pindah ke layar desktop
      window.addEventListener("resize", function () {
        if (window.innerWidth >= 768) {
          navMenu.classList.remove("max-h-96", "opacity-100");
          navMenu.classList.add("max-h-0", "opacity-0");
          iconOpen.classList.remove("hidden");
          iconClose.classList.add("hidden");
          navToggle.setAttribute("aria-expanded", "false");
        }
      });
    </script>

    <!-- Konten -->
    <main class="max-w-7xl mx-auto px-4 sm:px-8 lg:px-16 py-3 flex-1 w-full">
      {% block content %}{% endblock %}
    </main>
    <!-- Footer -->
    <footer class="bg-white border-t border-gray text-center text-xs text-gray-400 py-3">
      © 2026 GamerStress · Muhammad Sheva Adyaksa Rohendi · Universitas Nusa Putra
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
